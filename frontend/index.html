<!DOCTYPE html>
<html>
<head>
    <title>Smart Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <h1>Smart Scheduler ✨</h1>

    <!-- DATE -->
    <div class="card">
        <label for="date">Select Date</label>
        <input type="date" id="date">
    </div>

    <!-- TIME -->
    <div class="card">
        <label>Select Time</label>
        <div id="slots"></div>
    </div>

    <!-- DETAILS -->
    <div class="card">
        <label for="name">Name</label>
        <input id="name" autocomplete="name">

        <label for="email">Email</label>
        <input id="email" autocomplete="email">
    </div>

    <!-- PAYMENT -->
    <div class="card">
        <label>Payment</label>
        <div class="payment">
            <label><input type="radio" name="pay" value="UPI"> UPI</label>
            <label><input type="radio" name="pay" value="Card"> Card</label>
            <label><input type="radio" name="pay" value="Cash"> Cash</label>
        </div>
    </div>

    <button onclick="book()">Confirm Booking</button>

    <div id="list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
